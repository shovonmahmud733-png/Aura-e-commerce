<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Squircle Background -->
  <rect width="64" height="64" rx="18" fill="url(#auraBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="32" cy="32" r="14" fill="url(#auraGlow)" opacity="0.3" filter="url(#glowFilter)" />

  <!-- Core Geometric Aura Star / Sparkle -->
  <path d="M32 12C32 23 23 32 12 32C23 32 32 41 32 52C32 41 41 32 52 32C41 32 32 23 32 12Z" fill="url(#auraGlow)" />
  
  <!-- Accent Center Core -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>
